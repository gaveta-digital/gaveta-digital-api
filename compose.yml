services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    command: npm run dev
    volumes:
      - ./src:/app/src:ro
      - sqlite-data:/app/data
    init: true

  mobile:
    build:
      context: ./mobile
      args:
        EXPO_PUBLIC_API_URL: http://${HOST_IP}:8080
    ports:
      - "8081:8081"
    environment:
      EXPO_PUBLIC_API_URL: http://${HOST_IP}:8080
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP}
    volumes:
      - ./mobile:/app
      - mobile-node-modules:/app/node_modules
    stdin_open: true
    tty: true
    init: true
    depends_on:
      - api

volumes:
  sqlite-data:
  mobile-node-modules:
